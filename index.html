<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaishnav | Cyber Hive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FFD700; /* Honey Yellow */
            --bg-dark: #090909;
            --hex-bg: #111;
            /* Desktop Hex Size */
            --hex-w: 130px;
            --hex-h: 150px; 
            /* Mobile Hex Size */
            --hex-w-mob: 110px;
            --hex-h-mob: 127px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Header */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            margin-bottom: 40px; 
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        /* === GRID SYSTEM === */
        .hive-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .hex-row {
            display: flex;
            justify-content: center;
            /* This negative margin pulls the rows together to interlock */
            margin-top: -35px; 
            z-index: 1;
        }
        
        /* The first row shouldn't have a negative top margin */
        .hex-row:first-child {
            margin-top: 0;
        }

        /* === HEXAGON COMPONENT === */
        .hex-wrap {
            position: relative;
            width: var(--hex-w);
            height: var(--hex-h);
            margin: 0 5px; /* Side spacing */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, z-index 0.3s;
            cursor: pointer;
            /* Ensures hover state pops over neighbors */
            z-index: 1; 
        }

        .hex-inner {
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            background: var(--hex-bg);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: background 0.3s ease;
        }

        /* Content Styling */
        .hex-inner i {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .hex-inner span {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
        }

        .hex-inner .status {
            font-size: 0.55rem;
            color: #666;
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Hover Effects */
        .hex-wrap:hover {
            transform: scale(1.15);
            z-index: 100; /* Crucial: Brings it to front */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); /* Not visible due to clip-path, but keeps z-index active */
        }

        .hex-wrap:hover .hex-inner {
            background: var(--primary);
        }

        .hex-wrap:hover i {
            color: #000;
            transform: scale(1.2);
        }

        .hex-wrap:hover span, .hex-wrap:hover .status {
            color: #000;
            font-weight: 800;
        }

        /* Offline State */
        .offline {
            opacity: 0.5;
            filter: grayscale(1);
        }
        .offline:hover {
            opacity: 1;
            filter: grayscale(0);
        }

        /* === MOBILE RESPONSIVENESS === */
        @media (max-width: 600px) {
            /* On mobile, we break the rows and make a vertical zigzag stack */
            .hive-grid {
                display: block; /* Standard block flow */
                width: 300px;
                margin: 0 auto;
                padding-top: 20px;
            }

            .hex-row {
                display: contents; /* Removes the row structure visually */
            }

            .hex-wrap {
                width: var(--hex-w-mob);
                height: var(--hex-h-mob);
                margin: -25px auto 0 auto; /* Vertical stacking overlap */
                left: 0;
            }

            /* Zig-Zag Pattern: Shift Even items Right, Odd items Left */
            .hex-wrap:nth-child(odd) {
                transform: translateX(-35px);
            }
            .hex-wrap:nth-child(even) {
                transform: translateX(35px);
            }

            /* Fix hover on mobile so it doesn't break layout */
            .hex-wrap:hover {
                transform: scale(1.1); /* Slightly smaller zoom */
                z-index: 100;
            }
            /* Need to re-apply the zigzag shift on hover + scale */
            .hex-wrap:nth-child(odd):hover {
                transform: translateX(-35px) scale(1.1);
            }
            .hex-wrap:nth-child(even):hover {
                transform: translateX(35px) scale(1.1);
            }
            
            /* Reset the first item margin */
            .hex-row:first-child .hex-wrap:first-child {
                margin-top: 0;
            }
        }

        footer {
            margin-top: 50px;
            color: #444;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    
    <h1>LINK // HIVE</h1>

    <div class="hive-grid">
        
        <div class="hex-row">
            <div class="hex-wrap">
                <a href="https://vai838.github.io/" class="hex-inner" target="_blank">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <span>Personal</span>
                </a>
            </div>
            <div class="hex-wrap">
                <a href="https://bit.ly/elfenix_space" class="hex-inner" target="_blank">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Philanthropy</span>
                </a>
            </div>
        </div>

        <div class="hex-row">
            <div class="hex-wrap">
                <a href="https://instagram.com/el_.fenix" class="hex-inner" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                    <span>EdTech</span>
                </a>
            </div>
            <div class="hex-wrap">
                <a href="https://instagram.com/solipsist_v838" class="hex-inner" target="_blank">
                    <i class="fa-solid fa-camera-retro"></i>
                    <span>Captures</span>
                </a>
            </div>
            <div class="hex-wrap">
                <a href="https://instagram.com/scied_praxis" class="hex-inner" target="_blank">
                    <i class="fa-solid fa-users-viewfinder"></i>
                    <span>SciEd</span>
                </a>
            </div>
        </div>

        <div class="hex-row">
            <div class="hex-wrap offline">
                <div class="hex-inner">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                    <span class="status">Initializing...</span>
                </div>
            </div>
            <div class="hex-wrap offline">
                <div class="hex-inner">
                    <i class="fa-brands fa-flickr"></i>
                    <span>Flickr</span>
                    <span class="status">Offline</span>
                </div>
            </div>
        </div>

    </div>

    <footer>&copy; 2025 VAI838</footer>

    <script>
        // Subtle Background Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = Array.from({length: 40}, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: Math.random() * 2
        }));

        function animate() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#FFD700';
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.05)';
            
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0 || p.x > w) p.vx *= -1;
                if(p.y < 0 || p.y > h) p.vy *= -1;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // Connect nearby
                particles.forEach((p2, j) => {
                    if (i !== j) {
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                });
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
